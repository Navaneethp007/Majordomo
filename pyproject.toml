[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo"
version = "0.1.0"
description = "One spoken briefing of everything that needs you — pull requests, and your live coding sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Navaneeth Prabha" }]
keywords = ["briefing", "orchestration", "agents", "tts", "claude-code", "github", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
majordomo = "majordomo.cli:main"
mj = "majordomo.cli:main"

[project.optional-dependencies]
# NVIDIA Riva speaks gRPC rather than HTTP, so it is an extra — a text-only
# install has no business pulling in grpc.
nvidia = ["nvidia-riva-client>=2.14"]
# Speech *in*. Output needed nothing — winsound is stdlib — but there is no
# stdlib way to capture from a microphone, so this is the one new dependency
# voice costs. Riva handles the transcription itself via the nvidia extra.
voice = ["sounddevice>=0.4"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

# The annotated example config ships with the package: `mj config --init`
# has to work for a wheel install, which has no repo root to read from.
[tool.setuptools.package-data]
majordomo = ["config.example.yml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["majordomo*"]

[tool.pytest.ini_options]
markers = [
    "network: this test genuinely needs the network (nothing does today)",
]
