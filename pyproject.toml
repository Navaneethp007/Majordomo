[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `majordomo-cli`; the import package stays `majordomo`
# and the command stays `mj`. All three differ, for reasons worth recording.
#
# `majordomo` is taken on PyPI (0.2.0, an unrelated Google Chat package).
# `mj` is untaken but *rejected*: PyPI answers 400 "The name 'mj' isn't
# allowed" for names that are too short, reserved, or too close to an existing
# project — and a 404 from the API means only "nobody has it", never "you may
# have it". The upload is the only test of that, which is worth knowing before
# planning around a name.
#
# `[project.scripts]` below is independent of this, so what you type is `mj`
# whatever the distribution ends up called.
name = "majordomo-cli"
# Single-sourced from the package, which is where `mj --version` reads it.
# These were two independent literals that had no way of disagreeing loudly.
dynamic = ["version"]
description = "A personal assistant for your terminal: talks with your dev context loaded, and acts on it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Navaneeth Prabha" }]
keywords = ["assistant", "agent", "cli", "llm", "tts", "speech", "claude-code", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
# One command, one promise. There was a second `majordomo` entry point; two
# names for one door is exactly what this release is reducing, and nothing is
# published under it yet, so it goes now rather than becoming a promise.
mj = "majordomo.cli:main"

[project.optional-dependencies]
# NVIDIA Riva speaks gRPC rather than HTTP, so it is an extra — a text-only
# install has no business pulling in grpc.
nvidia = ["nvidia-riva-client>=2.14"]
# Speech *in*. Output needed nothing — winsound is stdlib — but there is no
# stdlib way to capture from a microphone, so this is the one new dependency
# voice costs. Riva handles the transcription itself via the nvidia extra.
voice = ["sounddevice>=0.4"]
# Text out of PDFs and Word files. Optional because a text-only install has
# no business carrying a PDF parser, and the refusal without it is honest.
documents = ["pypdf>=4.0", "python-docx>=1.1"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.dynamic]
version = { attr = "majordomo.__version__" }

# The annotated example config ships with the package: `mj config --init`
# has to work for a wheel install, which has no repo root to read from.
[tool.setuptools.package-data]
majordomo = ["config.example.yml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["majordomo*"]

[tool.pytest.ini_options]
markers = [
    "network: this test genuinely needs the network (nothing does today)",
    "gh: this test genuinely needs the real gh CLI (nothing does today)",
]
