[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo"
version = "0.1.0"
description = "One spoken briefing of everything that needs you — pull requests, and your live coding sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Navaneeth Prabha" }]
keywords = ["briefing", "orchestration", "agents", "tts", "claude-code", "github", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
majordomo = "majordomo.cli:main"
mj = "majordomo.cli:main"

[project.optional-dependencies]
# NVIDIA Riva speaks gRPC rather than HTTP, so it is an extra — a text-only
# install has no business pulling in grpc.
nvidia = ["nvidia-riva-client>=2.14"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["majordomo*"]
